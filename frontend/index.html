<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- External character portrait CDNs (e.g. static.wikia.nocookie.net)
         hotlink-block requests that carry a Referer from an unrecognized
         origin. Cytoscape's canvas background-image has no per-node
         referrerpolicy hook, so this is set page-wide rather than per-<img>. -->
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; connect-src 'self' https://accounts.google.com https://api.spoilerless.net https://*.onrender.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spoilerless</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
