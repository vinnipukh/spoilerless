[project]
name = "hdgrafcehennemi"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.7",
    "google-auth[requests]>=2.56.0",
    "neo4j>=6.2.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
hdgraf-setup = "backend.app.graph.setup:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
